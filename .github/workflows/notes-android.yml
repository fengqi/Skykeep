# 备忘录 fork 自己的安卓构建：推一个日期标签（如 20261121）就构建并发布，产物只有 APK。
# 与上游 release.yml 的区别：不构建桌面端，不要求版本提交，APK 用仓库 secret 里的
# debug 签名（与手机上 adb 安装的签名一致，可直接覆盖安装），Release 里只有这一个文件。
name: Notes android

on:
  push:
    tags: ["20*"]

permissions:
  contents: write

env:
  BUILD_TOOLS: "37.0.0"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-about@0.9.3
      - name: The release build, unsigned
        working-directory: android
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew --no-daemon assembleRelease
      - name: Signed with the shared key, and checked
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          [ -x "$tools/aapt2" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS" >/dev/null
          key="$RUNNER_TEMP/notes.keystore"
          ( umask 077; printf '%s' "$KEYSTORE" | base64 -d > "$key" )
          [ -s "$key" ] || { echo "::error::ANDROID_KEYSTORE is empty"; exit 1; }
          mkdir -p notes
          out="notes/备忘录-${GITHUB_REF_NAME}-android.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$out"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias androiddebugkey --ks-pass pass:"$KS_PW" --key-pass pass:"$KS_PW" "$out"
          "$tools/apksigner" verify "$out" && echo "signed and verified: $out"
          sha256sum "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes-apk
          path: notes/*.apk
          if-no-files-found: error
      - name: The release, the APK alone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" notes/*.apk \
            --title "备忘录 $GITHUB_REF_NAME" \
            --notes "自动构建于 $(date -u '+%Y-%m-%d %H:%M UTC')，提交 $GITHUB_SHA。覆盖安装：签名与手机上现有版本一致。" \
            --latest
